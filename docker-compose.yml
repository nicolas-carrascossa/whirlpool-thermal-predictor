# Sobe a API (FastAPI, preditor mock) e o front-end estático servido por nginx.
# O nginx repassa /api para a API, então o navegador enxerga uma única origem:
#   http://localhost:8080
#
#   docker compose up --build
#
# A API também fica exposta em http://localhost:8000 (Swagger em /docs).

services:
  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-por-um-valor-aleatorio-de-32-bytes}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-480}
      MODEL_MODE: ${MODEL_MODE:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost:4173}
      DATA_DIR: /data/dataset
      DB_PATH: /data/thermal.db
    ports:
      - "8000:8000"
    volumes:
      # Persiste usuários e access_log entre execuções.
      - api-data:/data

  web:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_DATA_SOURCE: api
        # Mesma origem: o nginx do próprio container faz o proxy de /api.
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  api-data:
