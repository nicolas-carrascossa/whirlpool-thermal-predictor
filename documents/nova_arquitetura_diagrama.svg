<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura atual do Thermal Predictor</title>
  <desc id="desc">Fluxo entre navegador React, API FastAPI, persistência SQLite, catálogo do backend e modelos treinados.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .box { stroke: #28506e; stroke-width: 2; rx: 14; }
      .web { fill: #e8f2f8; } .api { fill: #e9f4ed; } .data { fill: #fff4dc; } .model { fill: #f5eafa; } .store { fill: #eef0f3; }
      .title { font: 700 20px Arial, sans-serif; fill: #163c5a; }
      .body { font: 14px Arial, sans-serif; fill: #263746; }
      .small { font: 12px Arial, sans-serif; fill: #425766; }
      .arrow { stroke: #506b80; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .label { font: 12px Arial, sans-serif; fill: #28506e; font-weight: 700; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#506b80"/></marker>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text x="48" y="48" class="title" style="font-size:26px">Thermal Predictor — arquitetura de execução local</text>
  <text x="48" y="74" class="body">Uma aplicação web React consulta uma única API FastAPI; modelos e dados permanecem no servidor.</text>

  <rect x="55" y="145" width="255" height="280" class="box web"/>
  <text x="80" y="183" class="title">Cliente web</text>
  <text x="80" y="215" class="body">React + TypeScript + Vite</text>
  <text x="80" y="241" class="small">• Autenticação e token Bearer</text>
  <text x="80" y="264" class="small">• Configuração e histórico de sessão</text>
  <text x="80" y="287" class="small">• Resultados</text>
  <text x="80" y="310" class="small">• Mapa térmico 3D (R3F/Three.js)</text>
  <text x="80" y="333" class="small">• Métricas estatísticas</text>
  <text x="80" y="378" class="small">ApiSource é o padrão.</text>
  <text x="80" y="399" class="small">LocalMockSource é modo offline.</text>

  <rect x="465" y="120" width="310" height="330" class="box api"/>
  <text x="490" y="158" class="title">Serviço de API</text>
  <text x="490" y="184" class="body">FastAPI · src/backend/app</text>
  <text x="490" y="218" class="small">/api/v1/auth/login e /me</text>
  <text x="490" y="241" class="small">/api/v1/metadata</text>
  <text x="490" y="264" class="small">/api/v1/predictions</text>
  <text x="490" y="287" class="small">/api/v1/metrics</text>
  <line x1="490" y1="308" x2="745" y2="308" stroke="#a5bbac"/>
  <text x="490" y="335" class="small">• valida o contrato e a configuração</text>
  <text x="490" y="358" class="small">• seleciona Mock ou Real Predictor</text>
  <text x="490" y="381" class="small">• adiciona rastreabilidade à resposta</text>
  <text x="490" y="404" class="small">• registra acessos e contexto do modelo</text>

  <rect x="905" y="105" width="230" height="155" class="box data"/>
  <text x="930" y="143" class="title">Catálogo da API</text>
  <text x="930" y="170" class="body">src/backend/data</text>
  <text x="930" y="200" class="small">sensor_registry.json</text>
  <text x="930" y="222" class="small">sensor_stats.json</text>
  <text x="930" y="244" class="small">variable_options.json</text>

  <rect x="905" y="330" width="230" height="155" class="box model"/>
  <text x="930" y="368" class="title">Conjunto de modelos</text>
  <text x="930" y="395" class="body">models/</text>
  <text x="930" y="425" class="small">7 artefatos .joblib</text>
  <text x="930" y="447" class="small">manifest.json</text>
  <text x="930" y="469" class="small">métricas e codificações</text>

  <rect x="465" y="535" width="310" height="70" class="box store"/>
  <text x="490" y="568" class="title">Persistência local</text>
  <text x="490" y="591" class="small">SQLite: usuários, sessões e access_log com proveniência</text>

  <path d="M310,270 C365,270 400,270 465,270" class="arrow"/>
  <text x="340" y="252" class="label">HTTPS + JSON + Bearer</text>
  <path d="M775,220 C830,190 850,185 905,185" class="arrow"/>
  <text x="792" y="169" class="label">lê metadados</text>
  <path d="M775,345 C830,390 850,405 905,405" class="arrow"/>
  <text x="789" y="373" class="label">carrega artefatos</text>
  <path d="M620,450 L620,535" class="arrow"/>
  <text x="638" y="503" class="label">auditoria</text>
</svg>
